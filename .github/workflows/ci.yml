# The thing in this repo that can drift silently is the committed JS bundle:
# it is what forums actually load, and nothing rebuilds it on install. The
# composer manifest is checked alongside it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      # Since ships no src/ — extend.php is the whole PHP surface.
      - name: Lint extend.php
        run: php -l extend.php

  js:
    name: JS bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: js
        run: npm ci

      - name: Build
        working-directory: js
        run: npm run build

      # js/dist is committed and is what forums load. If a build from the
      # committed source produces different bytes, the shipped bundle is not
      # the shipped source — which is invisible until someone debugs the wrong
      # code.
      - name: Fail if the committed bundle is stale
        run: |
          if ! git diff --quiet -- js/dist; then
            echo "js/dist differs from a fresh build of js/src — run 'npm run build' in js/ and commit." >&2
            git diff --stat -- js/dist
            exit 1
          fi
